<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
 xmlns:h="http://xmlns.jcp.org/jsf/html"
 xmlns:f="http://java.sun.com/jsf/core"
 xmlns:p="http://primefaces.org/ui"
 xmlns:ui="http://java.sun.com/jsf/facelets">
 
	 <h:head>
		 <title>#{title}</title>
		 <h:outputStylesheet library="css" name="style.css"  />
	<h:outputStylesheet name="primeicons/primeicons.css"
		library="primefaces" />
	 </h:head>
	 
	 <h:body>
	 
	 	<div id="page">
	 
		 	<div class="views_2">
		  
			<header> <ui:insert name="header">
			 		<ui:include src="/WEB-INF/includes/layout/header.xhtml" />
			</ui:insert> </header>
			 
			 <div class="content_1">
			 	
        
				<p:blockUI block="@(body)" widgetVar="pageBlock" style="ui-block">
				    <i class="pi pi-spin pi-spinner" style="font-size:2rem;"></i>
				</p:blockUI>
				
				<p:ajaxStatus onstart="PF('pageBlock').show()"
					onsuccess="PF('pageBlock').hide()" onerror="PF('pageBlock').hide()" />
			 
				 <div id="content">
				 	<ui:insert name="content" >
				 		<ui:include src="/home.xhtml" />
				   	</ui:insert>
				 </div>
				 
				<footer> <ui:insert name="footer">
				 		<ui:include src="/WEB-INF/includes/layout/footer.xhtml" />
				</ui:insert> </footer>
				 
			 </div>
			 
			 </div>
			 
		</div>
	<style>
	.ui-blockui {
		background-color: transparent !important;
		background-image: none !important;
		opacity: 0 !important;
		filter: alpha(opacity = 0) !important;
	}
			 
	.ui-blockui-content {
		position: fixed !important;
		top: 50% !important;
		left: 50% !important;
		transform: translate(-50%, -50%) !important;
		margin: 0 !important;
		border: none !important;
		background: none !important;
	}
	</style>
	 </h:body>

</html>
